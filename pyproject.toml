[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ml/notebooks"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade, S security (bandit)
select = ["E", "W", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]  # asserts are the point of tests
"backend/app/detectors/rules.py" = ["E501"]  # one regex per line reads better
"backend/app/extract/anonymise.py" = ["E501"]
"ml/training/*" = ["E501"]  # report templates and long sklearn calls

[tool.ruff.lint.isort]
known-first-party = ["app", "ml"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
