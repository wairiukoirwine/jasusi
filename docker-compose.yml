# Local development services. Ports are bound to localhost only.
# Credentials here are dev placeholders that match .env.example; never reuse them in a deployment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jasusi
      POSTGRES_PASSWORD: jasusi
      POSTGRES_DB: jasusi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jasusi -d jasusi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflowdata:/mlflow

volumes:
  pgdata:
  mlflowdata:
